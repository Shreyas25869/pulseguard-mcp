<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="100%" height="100%" style="background:#0a0f1d; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#06b6d4" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#a855f7" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1060" height="620" fill="url(#bgGlow)" rx="16" />
  <rect width="1058" height="618" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15" />

  <!-- Title & Header Bar -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="16" r="16" fill="#0284c7" opacity="0.2" />
    <text x="16" y="22" font-size="20" text-anchor="middle" fill="#38bdf8">🛡️</text>
    <text x="44" y="16" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">PulseGuard MCP</text>
    <text x="44" y="32" font-size="12" fill="#94a3b8" font-family="monospace">System Architecture &amp; Data Flow · Model Context Protocol (2024-11-05)</text>

    <!-- Badges -->
    <rect x="730" y="4" width="105" height="24" rx="12" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <text x="782" y="20" font-size="10" font-family="monospace" font-weight="600" fill="#38bdf8" text-anchor="middle">Alexa+ Engine</text>

    <rect x="845" y="4" width="135" height="24" rx="12" fill="#7e22ce" fill-opacity="0.25" stroke="#a855f7" stroke-width="1" />
    <text x="912" y="20" font-size="10" font-family="monospace" font-weight="600" fill="#d8b4fe" text-anchor="middle">Amazon Bedrock Nova</text>
  </g>

  <!-- ==================== COLUMN 1: SENSORS & HOME ==================== -->
  <g transform="translate(40, 100)">
    <!-- Box Container -->
    <rect width="220" height="470" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Section Title -->
    <rect width="220" height="42" rx="16" fill="#1e293b" fill-opacity="0.5" />
    <text x="110" y="26" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">1. AMBIENT SENSORS</text>

    <!-- Card 1: Wearable Fall/Cardiac -->
    <g transform="translate(15, 60)">
      <rect width="190" height="110" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="#0284c7" fill-opacity="0.2" />
      <text x="28" y="33" font-size="14" text-anchor="middle">⌚</text>
      <text x="50" y="26" font-size="12" font-weight="700" fill="#f1f5f9">Wearable Band</text>
      <text x="50" y="40" font-size="10" fill="#38bdf8" font-family="monospace">Continuous Telemetry</text>
      <text x="15" y="66" font-size="10" fill="#94a3b8">• 3.85G Fall Impact IMU</text>
      <text x="15" y="82" font-size="10" fill="#94a3b8">• 142 BPM Tachycardia SpO2</text>
      <text x="15" y="98" font-size="10" fill="#94a3b8">• Posture Orientation Tilt</text>
    </g>

    <!-- Card 2: Smart Pill Dispenser -->
    <g transform="translate(15, 190)">
      <rect width="190" height="110" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="#d97706" fill-opacity="0.2" />
      <text x="28" y="33" font-size="14" text-anchor="middle">💊</text>
      <text x="50" y="26" font-size="12" font-weight="700" fill="#f1f5f9">Smart Dispenser</text>
      <text x="50" y="40" font-size="10" fill="#fbbf24" font-family="monospace">Prescription Adherence</text>
      <text x="15" y="66" font-size="10" fill="#94a3b8">• Slot 3 (Eliquis 5mg)</text>
      <text x="15" y="82" font-size="10" fill="#94a3b8">• 140 min Overdue Sensor</text>
      <text x="15" y="98" font-size="10" fill="#94a3b8">• BLE Beacon Adherence</text>
    </g>

    <!-- Card 3: Ring Security -->
    <g transform="translate(15, 320)">
      <rect width="190" height="125" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="28" cy="28" r="14" fill="#0891b2" fill-opacity="0.2" />
      <text x="28" y="33" font-size="14" text-anchor="middle">🔔</text>
      <text x="50" y="26" font-size="12" font-weight="700" fill="#f1f5f9">Ring Perimeter</text>
      <text x="50" y="40" font-size="10" fill="#22d3ee" font-family="monospace">Video &amp; Smart Access</text>
      <text x="15" y="66" font-size="10" fill="#94a3b8">• Ring Video Doorbell Pro</text>
      <text x="15" y="82" font-size="10" fill="#94a3b8">• Smart Deadbolt Actuator</text>
      <text x="15" y="98" font-size="10" fill="#94a3b8">• 2-Way Intercom Chime</text>
      <text x="15" y="114" font-size="10" fill="#94a3b8">• Auto-EMT Clearance</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: MCP SERVER ==================== -->
  <g transform="translate(300, 100)">
    <rect width="240" height="470" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)" />
    
    <rect width="240" height="42" rx="16" fill="#0284c7" fill-opacity="0.2" />
    <text x="120" y="26" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">2. PULSEGUARD MCP SERVER</text>

    <!-- Server Header -->
    <g transform="translate(15, 55)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" font-size="11" font-weight="700" fill="#e2e8f0">Transport: SSE + JSON-RPC</text>
      <text x="10" y="36" font-size="10" font-family="monospace" fill="#38bdf8">Endpoint: http://host/mcp/sse</text>
    </g>

    <!-- Tool 1 -->
    <g transform="translate(15, 115)">
      <rect width="210" height="54" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#06b6d4">get_patient_vitals_telemetry</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Streams HR, SpO2, impact G-force</text>
      <text x="10" y="46" font-size="8.5" font-family="monospace" fill="#64748b">Params: { patientId }</text>
    </g>

    <!-- Tool 2 -->
    <g transform="translate(15, 180)">
      <rect width="210" height="54" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#06b6d4">check_medication_adherence</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Reads slot sensors &amp; schedules</text>
      <text x="10" y="46" font-size="8.5" font-family="monospace" fill="#64748b">Params: { patientId }</text>
    </g>

    <!-- Tool 3 -->
    <g transform="translate(15, 245)">
      <rect width="210" height="54" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#06b6d4">control_ring_security</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Unlocks deadbolt &amp; Ring camera</text>
      <text x="10" y="46" font-size="8.5" font-family="monospace" fill="#64748b">Params: { action, reason }</text>
    </g>

    <!-- Tool 4 -->
    <g transform="translate(15, 310)">
      <rect width="210" height="54" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#06b6d4">dispatch_emergency_escalation</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Generates SBAR note &amp; SMS alerts</text>
      <text x="10" y="46" font-size="8.5" font-family="monospace" fill="#64748b">Params: { severity, sbarSummary }</text>
    </g>

    <!-- Tool 5 -->
    <g transform="translate(15, 375)">
      <rect width="210" height="54" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#06b6d4">record_care_event_log</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">Appends DynamoDB care ledger hash</text>
      <text x="10" y="46" font-size="8.5" font-family="monospace" fill="#64748b">Params: { eventType, outcome }</text>
    </g>

    <text x="120" y="452" font-size="9.5" fill="#64748b" text-anchor="middle" font-family="monospace">Standard Tool Specification v1.0</text>
  </g>

  <!-- ==================== COLUMN 3: BEDROCK AGENT ==================== -->
  <g transform="translate(580, 100)">
    <rect width="210" height="470" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
    
    <rect width="210" height="42" rx="16" fill="#7e22ce" fill-opacity="0.2" />
    <text x="105" y="26" font-size="12" font-weight="700" fill="#d8b4fe" text-anchor="middle" letter-spacing="0.5">3. ALEXA+ BEDROCK</text>

    <!-- Bedrock Loop Details -->
    <g transform="translate(15, 60)">
      <rect width="180" height="80" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#c7d2fe">Bedrock Converse</text>
      <text x="12" y="38" font-size="9.5" fill="#a5b4fc">Model: Amazon Nova Pro</text>
      <text x="12" y="52" font-size="9.5" fill="#a5b4fc">Fallback: Claude 3.5 Sonnet</text>
      <text x="12" y="68" font-size="9" font-family="monospace" fill="#818cf8">Latency: ~210ms</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="180" height="85" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#bfdbfe">Cognitive Loop</text>
      <text x="12" y="38" font-size="9.5" fill="#93c5fd">1. Autonomous Thought</text>
      <text x="12" y="53" font-size="9.5" fill="#93c5fd">2. MCP Tool Invocation</text>
      <text x="12" y="68" font-size="9.5" fill="#93c5fd">3. Result Synthesizing</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="180" height="85" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#99f6e4">Clinical Guardrails</text>
      <text x="12" y="38" font-size="9.5" fill="#5eead4">• Calm bedside voice tone</text>
      <text x="12" y="53" font-size="9.5" fill="#5eead4">• SBAR Triage Formatting</text>
      <text x="12" y="68" font-size="9.5" fill="#5eead4">• 0 False-Emergency Gate</text>
    </g>

    <g transform="translate(15, 355)">
      <rect width="180" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#e2e8f0">Autonomous Actions</text>
      <text x="12" y="38" font-size="9" fill="#cbd5e1">• Unlocks smart deadbolt</text>
      <text x="12" y="53" font-size="9" fill="#cbd5e1">• Stages EMT dispatch code</text>
      <text x="12" y="68" font-size="9" fill="#cbd5e1">• Starts 30s countdown</text>
      <text x="12" y="83" font-size="9" fill="#cbd5e1">• Speaks voice guidance</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: OUTPUTS & CLOUD ==================== -->
  <g transform="translate(830, 100)">
    <rect width="190" height="470" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    
    <rect width="190" height="42" rx="16" fill="#059669" fill-opacity="0.2" />
    <text x="95" y="26" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="0.5">4. CONSUMERS &amp; CLOUD</text>

    <!-- Echo Show 15 Display -->
    <g transform="translate(15, 60)">
      <rect width="160" height="115" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#f8fafc">Echo Show 15</text>
      <text x="12" y="36" font-size="9" font-family="monospace" fill="#38bdf8">Ambient Smart Display</text>
      <text x="12" y="56" font-size="9" fill="#cbd5e1">• Alexa Cyan Light Bar</text>
      <text x="12" y="70" font-size="9" fill="#cbd5e1">• Live ECG &amp; Vitals HUD</text>
      <text x="12" y="84" font-size="9" fill="#cbd5e1">• 30s Triage Protocol</text>
      <text x="12" y="98" font-size="9" fill="#cbd5e1">• WebRTC 2-Way Drop In</text>
    </g>

    <!-- Caregiver App -->
    <g transform="translate(15, 190)">
      <rect width="160" height="115" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#f8fafc">Caregiver Mobile</text>
      <text x="12" y="36" font-size="9" font-family="monospace" fill="#c084fc">Sarah Vance Portal</text>
      <text x="12" y="56" font-size="9" fill="#cbd5e1">• SMS/SNS High Alert</text>
      <text x="12" y="70" font-size="9" fill="#cbd5e1">• Remote Deadbolt Control</text>
      <text x="12" y="84" font-size="9" fill="#cbd5e1">• Direct Video Calling</text>
      <text x="12" y="98" font-size="9" fill="#cbd5e1">• Adherence Tracking</text>
    </g>

    <!-- Amazon DynamoDB -->
    <g transform="translate(15, 320)">
      <rect width="160" height="125" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#f8fafc">DynamoDB Ledger</text>
      <text x="12" y="36" font-size="9" font-family="monospace" fill="#34d399">AWS Audit Trail</text>
      <text x="12" y="56" font-size="9" fill="#cbd5e1">• Immutable Incident Log</text>
      <text x="12" y="70" font-size="9" fill="#cbd5e1">• SBAR Clinical Summary</text>
      <text x="12" y="84" font-size="9" fill="#cbd5e1">• SHA-256 Event Signatures</text>
      <text x="12" y="98" font-size="9" fill="#cbd5e1">• HIPAA/EHR Handoff</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTORS & ARROWS ==================== -->
  <!-- Col 1 to Col 2 -->
  <path d="M 260 215 L 300 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 260 345 L 300 345" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 260 480 L 300 480" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Col 2 to Col 3 (Bidirectional MCP / Bedrock) -->
  <path d="M 540 280 L 580 280" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <path d="M 580 340 L 540 340" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)" />

  <text x="560" y="272" font-size="8.5" font-family="monospace" fill="#38bdf8" text-anchor="middle">Tools Ingest</text>
  <text x="560" y="356" font-size="8.5" font-family="monospace" fill="#c084fc" text-anchor="middle">Tool Execution</text>

  <!-- Col 3 to Col 4 -->
  <path d="M 790 215 L 830 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 790 345 L 830 345" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <path d="M 790 480 L 830 480" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)" />
</svg>